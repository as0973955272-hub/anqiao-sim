<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安橋人生模擬器</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;margin:0;padding:0 0 70px;background:#eef4ff;color:#10213f;font-size:16px}
header{background:#1d4ed8;color:#fff;padding:12px 14px;font-weight:bold;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between}
section,.card{background:#fff;margin:10px;padding:12px;border:1px solid #c3d3ee;border-radius:8px}
h2{font-size:16px;margin:0 0 8px}
input,select{font:inherit;padding:9px;border:1px solid #9bb5e6;border-radius:6px;width:100%;min-width:0;background:#fff}
.f{display:flex;gap:8px;margin-bottom:8px;align-items:center}.f label{flex:0 0 auto;font-size:14px}
.item{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.item .c{flex:0 0 64px;text-align:center}.item input[type=checkbox]{width:26px;height:26px;flex:0 0 auto}
.pc{border:1px solid #d3def2;border-radius:8px;padding:8px;margin-bottom:8px;background:#f7faff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:14px;align-items:center}
.chip{padding:5px 10px;border:1px solid #9bb5e6;border-radius:16px;background:#fff}
.chip.x{background:#c00000;color:#fff;border-color:#c00000}
button{font:inherit;padding:9px 14px;border:0;border-radius:6px;background:#5b6b8a;color:#fff}
.del{background:#b3261e;padding:9px 11px;flex:0 0 auto}.add{background:#2563eb;width:100%}.go{background:#1d4ed8;font-weight:bold;width:100%;padding:13px;margin-top:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #c3d3ee;display:flex;z-index:30}
nav button{flex:1;background:none;color:#566;padding:13px 4px;border-radius:0}nav button.on{color:#1d4ed8;font-weight:bold;border-top:3px solid #1d4ed8}
.warn{color:#b3261e;font-size:14px;white-space:pre-line;margin:0 12px}.hint{font-size:13px;color:#566;margin:4px 0}
.wrap{overflow:auto;margin:10px;max-height:75vh;border:1px solid #333;background:#fff}
table{border-collapse:separate;border-spacing:0;font-size:14px;width:100%}
td,th{border-right:1px solid #ccc;border-bottom:1px solid #ccc;padding:4px 6px;text-align:center;white-space:nowrap;min-width:30px}
th{background:#cfe0fb;position:sticky;top:0;z-index:2}
.s1{position:sticky;left:0;background:#fff;z-index:1;min-width:64px;font-weight:bold}th.s1{background:#cfe0fb;z-index:3}
.t{background:#cfe0fb;color:#0b3d91;font-size:17px;text-align:left;position:static}
.r{color:#c00000;font-weight:bold}
.duty{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border:1px solid #d3def2;border-radius:10px;margin-bottom:8px;background:#fff}
.bd{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto;margin-right:10px}
.ok{background:#ecfdf5;color:#059669;border:1px solid #a7f3d0}.lt{background:#fffbeb;color:#d97706;border:1px solid #fde68a}
.ms{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}.of{background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe}.nn{background:#f1f5f9;color:#94a3b8;border:1px dashed #cbd5e1}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:50}.mod.open{display:flex}
.mc{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:16px;max-height:90vh;overflow:auto}
.up{display:block;border:2px dashed #3b82f6;background:#eff6ff;border-radius:10px;padding:16px;text-align:center;font-weight:bold;color:#1d4ed8}
.bc{display:flex;gap:10px;border:1px solid #d3def2;border-radius:8px;padding:8px;margin-bottom:8px;background:#f7faff}
.bc img{width:64px;height:64px;object-fit:cover;border-radius:6px;flex:0 0 auto;background:#ddd}
.row{display:flex;gap:8px}.row>*{flex:1}
@media print{header,section,nav,.warn,.noprint{display:none}.wrap{max-height:none}}
.c1{color:#059669;font-weight:700}.c2{color:#d97706;font-weight:700}.c3{color:#dc2626;font-weight:700}.c4{color:#4338ca}#sumG td,#sumG th{min-width:34px;padding:3px 2px;font-size:12px}
.wbtn{width:100%;max-width:360px;padding:15px;margin:6px 0;font-size:18px;background:#fff;color:#1d4ed8;font-weight:bold;border-radius:10px}.sl{display:flex;align-items:center;gap:10px;background:#ffffff26;border-radius:10px;padding:12px;margin-bottom:8px;font-size:17px}
</style></head><body>
<div id="wel" style="position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#0b2f78,#1d4ed8 55%,#3b82f6);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:auto">
<div style="font-size:56px">🛡️</div>
<h1 style="font-size:26px;margin:10px 0 8px;line-height:1.35">歡迎來到<br>安橋人生模擬器</h1>
<div style="font-size:14px;opacity:.92;margin-bottom:26px">作者：安橋台南辦公室　陳正和 經理</div>
<button class="wbtn" onclick="newSave()">＋ 新增存檔</button>
<button class="wbtn" onclick="toggleLoad()">📂 載入存檔</button>
<div id="slots" style="width:100%;max-width:360px;margin-top:10px"></div>
<button class="wbtn" id="wback" style="display:none;background:#ffffff33;color:#fff;font-size:16px" onclick="$('wel').style.display='none'">返回目前存檔</button>
</div>
<header><span>🛡 安橋人生模擬器 <button onclick="showWel()" style="padding:3px 8px;font-size:12px;margin-left:6px;background:#ffffff40">存檔</button></span><span style="font-size:12px;text-align:right"><span id="hd"></span><br><span id="sv"></span></span></header>

<!-- 排班 -->
<div id="p-roster">
<section><h2>班別／基本設定</h2>
<div class="f"><label>目前班別</label><select id="prof" onchange="switchProf(this.value)"></select></div>
<div class="row" style="margin-bottom:8px"><button onclick="newProf()">＋ 新增班別</button><button class="del" onclick="delProf()">刪除此班別</button></div>
<div class="f"><label>班表名稱</label><input type="text" id="site" onchange="save();drawProf();drawRoster()"></div>
<div class="f"><label>月份</label><input type="month" id="ym" onchange="save();drawRoster()"></div>
<div class="row"><div class="f"><label>上班</label><input type="time" id="st" onchange="save()"></div><div class="f"><label>時數</label><input type="number" id="ln" min="1" max="24" onchange="save()"></div></div>
<div class="f"><label>每人每月休幾天</label><input type="number" id="rest" min="0" max="15" onchange="save()"></div>
</section>
<section><h2>哨點</h2><div class="hint">勾選＝本月啟用。代號就是班表格子顯示的字。</div>
<div id="posts"></div><button class="add" onclick="addPost()">＋ 新增哨點</button></section>
<section><h2>人員</h2><div class="hint">點哨點代號＝禁止此人排該哨點（變紅）。人員同時用於工時核對。</div>
<div id="ppl"></div><button class="add" onclick="addPerson()">＋ 新增人員</button>
<button class="add" style="background:#5b6b8a;margin-top:8px" onclick="anon()">🔒 一鍵匿名（姓名改成人員1、2…，清除編號）</button>
<button class="go" onclick="gen()">產生班表</button></section>
<div class="warn" id="warn"></div>
<div class="wrap" id="out" style="display:none"></div>
<div class="wrap" id="stat" style="display:none"></div>
<div class="row noprint" style="margin:0 10px"><button onclick="window.print()">列印班表</button><button onclick="rosterCsv()">班表 CSV</button><button onclick="imgRoster()">🖼 存成圖片</button></div>
</div>

<!-- 今日核對 -->
<div id="p-today" style="display:none">
<div class="card f" style="margin-bottom:0"><label>📅 班別日期</label><input type="date" id="dt" onchange="drawToday()"></div>
<div class="card"><div style="font-size:14px" id="lg"></div></div>
<div id="duty" style="margin:10px"></div>
<div class="row" style="margin:0 10px"><button class="go" style="margin:0" onclick="imgToday()">🖼 產生今日核對圖片</button></div>
</div>

<!-- 月總結 -->
<div id="p-sum" style="display:none">
<div class="card f" style="margin-bottom:0"><label>月份</label><input type="month" id="sm" onchange="drawSum()"></div>
<div class="wrap" id="sumT"></div>
<div class="hint" style="margin:0 12px">◯準時 △遲到 ✕缺卡 休休假。遲到時數＝上班打卡晚於規定時間的總和。缺卡包含「班表有排班但沒打卡紀錄」的過去日期。</div>
<h2 style="margin:10px 12px 0">時數表</h2><div class="wrap" id="sumG"></div>
<div class="row" style="margin:10px"><button onclick="sumCsv()">匯出 CSV</button><button onclick="imgSum()">🖼 產生圖片</button></div>
<section><h2>資料備份</h2><div class="hint">備份檔只含班表與打卡紀錄，圖片不在內。</div><div class="row"><button onclick="backup()">下載備份</button><button onclick="$('rf').click()">還原備份</button></div>
<input type="file" id="rf" accept=".json" style="display:none" onchange="restore(this)"></section>
</div>

<nav><button id="n-roster" class="on" onclick="tab('roster')">排班</button><button id="n-today" onclick="tab('today')">今日核對</button><button id="n-sum" onclick="tab('sum')">月總結</button></nav>

<!-- 彈窗：單筆登記 -->
<div class="mod" id="m1"><div class="mc">
<h2 id="m1t"></h2>
<div class="f"><label>狀態</label><select id="mst" onchange="onSt()"><option value="ok">◯ 準時</option><option value="late">△ 遲到</option><option value="miss">✕ 缺卡</option><option value="off">休 休假</option></select></div>
<div id="tf"><div class="row"><div><label class="hint">上班打卡</label><input type="time" id="mi" oninput="tm()"></div><div><label class="hint">下班打卡</label><input type="time" id="mo" oninput="ah()"></div></div>
<div class="f" style="margin-top:8px"><label>工時</label><input type="number" id="mh" step="0.1" min="0" max="24"></div></div>
<div class="f"><label>備註</label><input type="text" id="mn" placeholder="例：遲到原因、卡機號碼"></div>
<div class="f"><label>📎 圖片</label><button type="button" onclick="$('pf').click()" style="flex:1">新增圖片</button></div>
<input type="file" id="pf" accept="image/*" multiple style="display:none" onchange="addImgs(this)">
<div id="th" class="chips" style="margin-bottom:10px"></div>
<div class="row"><button class="del" onclick="delRec()">清除</button><button class="go" style="margin:0;flex:2" onclick="saveRec()">儲存</button></div>
<button style="width:100%;margin-top:8px" onclick="cancelRec()">關閉</button>
</div></div>
<div class="mod" id="m4"><div class="mc"><div class="hint">可下載、分享，或長按圖片直接儲存</div><div style="overflow:auto;max-height:62vh;border:1px solid #ccc"><img id="im"></div><div class="row" style="margin-top:8px"><button class="go" style="margin:0" onclick="dlImg()">下載</button><button onclick="shareImg()">分享</button><button onclick="cm('m4')">關閉</button></div></div></div>
<div class="mod" id="m3" onclick="cm('m3')" style="align-items:center;background:#000e"><img id="vi" style="width:100%;max-height:100vh;object-fit:contain"></div>
<div id="toast" style="position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222c;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:99"></div>

<script>
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY="guard_all_v1",KEY2="guard_root_v2",WK="日一二三四五六";
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const shiftDay=(s,n)=>{const p=s.split("-");return ds(new Date(+p[0],+p[1]-1,+p[2]+n))};
function today(){const d=new Date();if(d.getHours()<12)d.setDate(d.getDate()-1);return ds(d)}
const mk=(n,i)=>({uid:"u"+i,id:"",name:n,ban:[]});
const newS=()=>({ym:today().slice(0,7),site:"夜班班表",rest:6,
posts:["安檢哨(主哨)","安檢哨(副哨1)","安檢哨(副哨2)","大門哨(主哨)","大門哨(副哨)","機動哨(主哨)","機動哨(副哨)","碼頭哨","停車場哨","中控哨"].map((n,i)=>({code:String(i+1),name:n,on:true})),
ppl:Array.from({length:12},(_,i)=>"人員"+(i+1)).map(mk),roster:{},rec:{}});let S=newS();
let ROOT=null,IDX=[];
const LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
IDX=LS("guard_idx")||[];
if(!IDX.length){const t=LS(KEY2)||(LS(KEY)?{cur:"p1",list:{p1:Object.assign(newS(),LS(KEY))}}:null);
if(t&&t.list){const id="s"+Date.now();t.saveId=id;t.saveName="存檔1";IDX=[{id,name:"存檔1",savedAt:t.savedAt||Date.now()}];try{localStorage.setItem("guard_idx",JSON.stringify(IDX));localStorage.setItem("guard_slot_"+id,JSON.stringify(t))}catch(e){}}}
function fix(){Object.values(ROOT.list).forEach(p=>{p.start=p.start||"19:00";p.len=p.len||12;p.roster=p.roster||{};p.rec=p.rec||{}});if(!ROOT.list[ROOT.cur])ROOT.cur=Object.keys(ROOT.list)[0];S=ROOT.list[ROOT.cur]}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
function readF(){S.ym=$("ym").value||S.ym;S.site=$("site").value||S.site;S.rest=+$("rest").value;S.start=$("st").value||"19:00";S.len=+$("ln").value||12}
function save(){readF();persist()}
function saveIdx(){try{localStorage.setItem("guard_idx",JSON.stringify(IDX))}catch(e){}ready.then(()=>tx("s","readwrite",q=>q.put(IDX,"idx")))}
let pt;function persist(){clearTimeout(pt);pt=setTimeout(persistNow,250)}
function flush(){clearTimeout(pt);persistNow()}
function persistNow(){if(!ROOT)return;ROOT.savedAt=Date.now();const id=ROOT.saveId;let e=IDX.find(x=>x.id==id);if(!e){e={id};IDX.push(e)}e.name=ROOT.saveName;e.savedAt=ROOT.savedAt;
try{localStorage.setItem("guard_slot_"+id,JSON.stringify(ROOT))}catch(x){}
saveIdx();ready.then(()=>tx("s","readwrite",q=>q.put(ROOT,id))).then(()=>{const d=new Date();$("sv").textContent="💾 "+ROOT.saveName+" "+pad(d.getHours())+":"+pad(d.getMinutes())})}
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2500)}
const om=id=>$(id).classList.add("open"),cm=id=>$(id).classList.remove("open");
function tab(t){["roster","today","sum"].forEach(k=>{$("p-"+k).style.display=k==t?"block":"none";$("n-"+k).className=k==t?"on":""});
window.scrollTo(0,0);if(t=="today")drawToday();if(t=="sum")drawSum()}

/* ---------- 哨點／人員設定 ---------- */
function drawPosts(){$("posts").innerHTML=S.posts.map((p,i)=>`<div class="item"><input type="checkbox" ${p.on?"checked":""} onchange="S.posts[${i}].on=this.checked;save();drawPpl()"><input class="c" value="${esc(p.code)}" placeholder="代號" onchange="chCode(${i},this.value)"><input value="${esc(p.name)}" placeholder="名稱" onchange="S.posts[${i}].name=this.value;save()"><button class="del" onclick="delPost(${i})">刪</button></div>`).join("")}
function drawPpl(){$("ppl").innerHTML=S.ppl.map((p,i)=>`<div class="pc"><div class="item" style="margin:0"><input style="flex:0 0 92px" value="${esc(p.id)}" placeholder="編號(選填)" onchange="S.ppl[${i}].id=this.value;save()"><input value="${esc(p.name)}" placeholder="姓名" onchange="S.ppl[${i}].name=this.value;save()"><button class="del" onclick="delPerson(${i})">刪</button></div><div class="chips">禁止：${S.posts.map((q,k)=>q.on?`<span class="chip ${p.ban.includes(q.code)?"x":""}" onclick="tg(${i},${k})">${esc(q.code)}</span>`:"").join("")}</div></div>`).join("")}
function tg(i,k0){const c=S.posts[k0].code,b=S.ppl[i].ban,k=b.indexOf(c);k<0?b.push(c):b.splice(k,1);save();drawPpl()}
function addPost(){const n=S.posts.map(p=>parseInt(p.code)||0);S.posts.push({code:String(Math.max(0,...n)+1),name:"",on:true});save();drawPosts();drawPpl()}
function delPost(i){if(!confirm("刪除哨點 "+S.posts[i].code+"？"))return;const c=S.posts[i].code;S.posts.splice(i,1);S.ppl.forEach(p=>p.ban=p.ban.filter(x=>x!==c));save();drawPosts();drawPpl()}
function chCode(i,v){v=v.trim();const o=S.posts[i].code;if(!v||S.posts.some((p,k)=>k!=i&&p.code===v)){alert("代號空白或重複");drawPosts();return}S.posts[i].code=v;S.ppl.forEach(p=>p.ban=p.ban.map(x=>x===o?v:x));save();drawPpl()}
function addPerson(){S.ppl.push({uid:"u"+Date.now(),id:"",name:"",ban:[]});save();drawPpl()}
function delPerson(i){if(!confirm("刪除 "+(S.ppl[i].name||"此人")+"？（已有的紀錄仍會保留在資料裡）"))return;S.ppl.splice(i,1);save();drawPpl()}

/* ---------- 自動排班 ---------- */
function hung(a){const n=a.length,u=Array(n+1).fill(0),v=Array(n+1).fill(0),p=Array(n+1).fill(0),w=Array(n+1).fill(0);
for(let i=1;i<=n;i++){p[0]=i;let j0=0;const mv=Array(n+1).fill(Infinity),us=Array(n+1).fill(false);
do{us[j0]=true;const i0=p[j0];let dl=Infinity,j1=0;
for(let j=1;j<=n;j++)if(!us[j]){const c=a[i0-1][j-1]-u[i0]-v[j];if(c<mv[j]){mv[j]=c;w[j]=j0}if(mv[j]<dl){dl=mv[j];j1=j}}
for(let j=0;j<=n;j++)if(us[j]){u[p[j]]+=dl;v[j]-=dl}else mv[j]-=dl;j0=j1}while(p[j0]);
do{const j1=w[j0];p[j0]=p[j1];j0=j1}while(j0)}
const r=[];for(let j=1;j<=n;j++)r[p[j]-1]=j-1;return r}
function gen(){save();
if(S.roster[S.ym]&&!confirm(S.ym+" 已有班表，要重新產生並覆蓋嗎？（該月打卡紀錄不受影響）"))return;
const [Y,M]=S.ym.split("-").map(Number),D=new Date(Y,M,0).getDate(),Q=S.rest;
const E=S.posts.filter(p=>p.on&&p.code),pe=S.ppl,N=pe.length,warn=[];
if(!E.length||!N){$("warn").textContent="請先新增哨點和人員";return}
if(N<E.length)warn.push(`人數(${N})少於啟用哨點(${E.length})，每天會有哨點空缺。`);
const total=N*Q,base=Math.floor(total/D),ex=total-base*D,left=pe.map(()=>Q),off=pe.map(()=>Array(D).fill(false));
const sk=pe.map(()=>0);
for(let d=0;d<D;d++){let s=base+(d*7%D<ex?1:0);s=Math.min(s,Math.max(0,N-E.length));
pe.map((_,i)=>i).filter(i=>left[i]>0&&!(d&&off[i][d-1])).sort((a,b)=>left[b]-left[a]+(sk[b]-sk[a])*.25+(Math.random()-.5)*1.5).slice(0,s).forEach(i=>{off[i][d]=true;left[i]--});pe.forEach((_,i)=>sk[i]=off[i][d]?0:sk[i]+1)}
left.forEach((l,i)=>{if(l>0)warn.push(`${pe[i].name} 休假少 ${l} 天（人數不足）`)});
const cnt=pe.map(()=>({})),lp=pe.map(()=>""),cells={};pe.forEach(p=>cells[p.uid]=Array(D).fill(""));
for(let d=0;d<D;d++){const W=pe.map((_,i)=>i).filter(i=>!off[i][d]),n=Math.max(W.length,E.length);
const cost=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>{if(i>=W.length||j>=E.length)return 0;const w=W[i],c=E[j].code;
if(pe[w].ban.includes(c))return 1e6;return(cnt[w][c]||0)*10+(lp[w]===c?4:0)+Math.random()}));
const r=hung(cost);
W.forEach((w,i)=>{const j=r[i];if(j<E.length){const c=E[j].code;if(cost[i][j]>=1e6)warn.push(`${M}/${d+1} ${pe[w].name} 被迫排到禁止哨點 ${c}`);
cells[pe[w].uid][d]=c;cnt[w][c]=(cnt[w][c]||0)+1;lp[w]=c}else{cells[pe[w].uid][d]="備";lp[w]=""}});
off.forEach((o,k)=>{if(o[d])cells[pe[k].uid][d]="休"});
if(W.length<E.length)warn.push(`${M}/${d+1} 上班 ${W.length} 人，有哨點空缺`)}
S.roster[S.ym]={D,cells,names:Object.fromEntries(pe.map(p=>[p.uid,p.name])),site:S.site,codes:E.map(e=>e.code)};
